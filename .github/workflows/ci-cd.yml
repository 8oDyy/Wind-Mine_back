name: CI/CD

# Tests sur chaque PR vers main ; tests + déploiement sur push vers main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest tests/ -v

  deploy:
    name: Déploiement
    needs: test
    # Uniquement sur push vers main (pas sur les PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Synchroniser le code (le .env du serveur est préservé)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude '.git' --exclude '.github' \
            --exclude '.venv' --exclude 'venv' \
            --exclude '__pycache__' --exclude '*.pyc' \
            --exclude '.pytest_cache' --exclude '.idea' --exclude '.DS_Store' \
            --exclude '.env' --exclude '.env.*' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/windmind/"

      - name: Rebuild + redémarrage de la stack
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /home/'"${{ secrets.DEPLOY_USER }}"'/windmind && \
             docker compose -f deploy/docker-compose.yml up -d --build --remove-orphans && \
             docker compose -f deploy/docker-compose.yml exec -T -w /etc/caddy caddy caddy reload && \
             docker compose -f deploy/docker-compose.yml ps'

      - name: Healthcheck public
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://winemind.fr/health || true)
            echo "tentative $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::Healthcheck échoué (pas de 200 sur https://winemind.fr/health)"
          exit 1
