# Stack de PRODUCTION — déployée sur le VPS via GitHub Actions.
# (Le docker-compose.yml à la racine reste la version simple pour le dev local.)
# api : interne uniquement. caddy : seul exposé publiquement (80/443, HTTPS auto).
name: windmind

services:
  api:
    build:
      context: ..            # le Dockerfile et app/ sont à la racine du repo
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env        # secrets présents sur le serveur, jamais dans le repo
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Monter le RÉPERTOIRE (pas le fichier seul) : rsync remplace le Caddyfile
      # par un nouvel inode, et un bind de fichier resterait figé sur l'ancien.
      # Avec le bind du répertoire, "caddy reload" (fait par la CI) voit la
      # nouvelle version sans recréer le conteneur.
      - ./:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      # "edge" : réseau docker partagé du VPS — permet à caddy de joindre les
      # conteneurs d'autres apps (ex. melo-api). Créé hors compose :
      #   docker network create edge
      - default
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
